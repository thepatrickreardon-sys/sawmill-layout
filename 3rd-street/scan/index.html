<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14211B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>3rd Street 3D scan</title>
<style id="ttfonts">@font-face{font-family:'Satoshi';src:url('../../brand/fonts/Satoshi-Regular.woff2') format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'Satoshi';src:url('../../brand/fonts/Satoshi-Medium.woff2') format('woff2');font-weight:500 600;font-display:swap}@font-face{font-family:'Satoshi';src:url('../../brand/fonts/Satoshi-Bold.woff2') format('woff2');font-weight:700;font-display:swap}@font-face{font-family:'Satoshi';src:url('../../brand/fonts/Satoshi-Black.woff2') format('woff2');font-weight:800 900;font-display:swap}@font-face{font-family:'Giften';src:url('../../brand/fonts/Giften.woff') format('woff');font-weight:400;font-display:swap}</style>
<style>
:root{--brand:#86C53F;--sun:#E2E872;--forest:#14211B;--forest2:#22372B;
  --field:radial-gradient(120% 90% at 50% 0%,#2F4A3A 0%,#22372B 45%,#14211B 100%);
  --stripes:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 38px,rgba(0,0,0,.04) 38px 76px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfd8cc;font-family:"Satoshi",system-ui,sans-serif;overscroll-behavior:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
.bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 10px;background:var(--stripes),var(--field);color:#fff;box-shadow:0 4px 18px rgba(20,33,27,.3)}
.bar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--sun),var(--brand))}
.bar h1{margin:0;font:700 19px/1.05 "Satoshi",sans-serif;letter-spacing:.05em;text-transform:uppercase;flex:1;min-width:0}
.bar h1 small{display:block;font:500 12px "Satoshi",sans-serif;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.7);margin-top:2px}
button{font:700 14px "Satoshi",sans-serif;border-radius:10px;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;-webkit-user-select:none;user-select:none}
button:active{transform:scale(.96)}
button.sun{background:var(--sun);color:var(--forest);border-color:var(--sun)}
.views{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;gap:8px;padding:0 12px;flex-wrap:wrap}
.views button{background:rgba(20,33,27,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.views button[aria-pressed="true"]{background:var(--sun);color:var(--forest)}
.hint{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);z-index:4;background:rgba(20,33,27,.85);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.load{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:var(--stripes),var(--field);color:#fff;text-align:center;transition:opacity .5s}
.load b{font:700 26px "Satoshi",sans-serif;letter-spacing:.05em;text-transform:uppercase}
.load .pb{width:220px;height:8px;border-radius:99px;background:rgba(255,255,255,.15);margin:14px auto 8px;overflow:hidden}
.load .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--sun));transition:width .2s}
.load p{margin:0;color:rgba(255,255,255,.7);font-size:13px}
</style></head><body>
<div class="bar"><button id="back" aria-label="Back to the app">‹ Back</button><h1>3D site scan<small>3rd Street · scanned Nov 25, 2026</small></h1><button class="sun" id="reset">Reset</button></div>
<div class="views" id="views">
  <button data-v="street" aria-pressed="true">Walk-up</button>
  <button data-v="back">Other side</button>
  <button data-v="high">Above</button>
</div>
<div class="hint" id="hint">Drag to turn · pinch to zoom · two fingers to slide</div>
<div class="load" id="load"><div><b>Loading the scan</b><div class="pb"><i id="pb"></i></div><p id="lp">First time takes a moment (12 MB). After that it opens with no signal.</p></div></div>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SparkRenderer, SplatMesh } from './spark.module.js';
const SCAN='site-2026-11-25.spz';
const renderer=new THREE.WebGLRenderer({antialias:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0xcfd8cc,1);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.05,600);
const spark=new SparkRenderer({renderer}); scene.add(spark);
const ctl=new OrbitControls(cam,renderer.domElement); ctl.enableDamping=true; ctl.dampingFactor=.08; ctl.maxPolarAngle=Math.PI*0.495; ctl.minDistance=1.5; ctl.maxDistance=120; ctl.screenSpacePanning=false; ctl.rotateSpeed=.6;
const VIEWS={street:{p:[-4,3,30],t:[-6,-0.4,11]},back:{p:[-6,1.7,-2],t:[-5,-0.5,15]},high:{p:[-6,9,27],t:[-6,-0.5,9]}};
let anim=null;
function go(name,instant){ const v=VIEWS[name]; document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===name));
  const p0=cam.position.clone(), t0=ctl.target.clone(), p1=new THREE.Vector3(...v.p), t1=new THREE.Vector3(...v.t);
  if(instant){ cam.position.copy(p1); ctl.target.copy(t1); ctl.update(); return; }
  const s=performance.now(); anim=()=>{ const k=Math.min(1,(performance.now()-s)/700), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; cam.position.lerpVectors(p0,p1,e); ctl.target.lerpVectors(t0,t1,e); if(k>=1) anim=null; }; }
go('street',true);
document.getElementById('views').onclick=e=>{ const b=e.target.closest('[data-v]'); if(b) go(b.dataset.v); };
document.getElementById('reset').onclick=()=>go('street');
document.getElementById('back').onclick=()=>{ if(history.length>1) history.back(); else location.href='../#home'; };
ctl.addEventListener('start',()=>{ anim=null; document.getElementById('hint').style.opacity=0; });
addEventListener('resize',()=>{ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
// load with progress
const pb=document.getElementById('pb');
async function getBytes(){ const res=await fetch(SCAN); const len=+res.headers.get('content-length')||12690150; const rd=res.body&&res.body.getReader?res.body.getReader():null;
  if(!rd) return new Uint8Array(await res.arrayBuffer());
  const parts=[]; let got=0; for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); got+=value.length; pb.style.width=Math.min(100,got/len*100)+'%'; }
  const out=new Uint8Array(got); let o=0; for(const p of parts){ out.set(p,o); o+=p.length; } return out; }
try{
  const bytes=await getBytes(); document.getElementById('lp').textContent='Building the 3D view…';
  const mesh=new SplatMesh({fileBytes:bytes, fileName:SCAN}); scene.add(mesh); await mesh.initialized;
  const L=document.getElementById('load'); L.style.opacity=0; setTimeout(()=>L.remove(),500);
  setTimeout(()=>document.getElementById('hint').style.opacity=0,5000);
}catch(e){ document.getElementById('lp').textContent='Could not load the scan. Open it once with signal so it saves on this phone.'; }
renderer.setAnimationLoop(()=>{ if(anim) anim(); ctl.update(); renderer.render(scene,cam); });
</script>
</body></html>
