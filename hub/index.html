<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10261a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TT Jobs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<title>Turf Tek Jobs</title>
<style>
:root{--bg:#eef2f4;--panel:#fff;--ink:#15212b;--muted:#5b6b78;--line:#d3dce2;--paint:#e8590c;--paintsoft:#fff0e6;--steel:#1f5f8b;--steelsoft:#e6f0f7;--good:#1e7d45;--goodbg:#e3f3e9;--warn:#a86500;--warnbg:#fbefd9;--bad:#b42318;--badbg:#fbe4e1;--shadow:0 1px 2px rgba(21,33,43,.06),0 4px 14px rgba(21,33,43,.06);--display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em}
.brand b{color:var(--paint)}
.sub{font-size:13px;opacity:.75}
.top .sp{flex:1}
.iconbtn{background:none;border:0;color:#fff;font-size:22px;padding:6px 8px;border-radius:8px}
main{padding:12px 12px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;padding:9px 0 8px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button span{font-size:20px;line-height:1}
.tabs button.on{color:var(--paint)}
h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:18px 2px 8px;color:var(--muted)}
h2:first-child{margin-top:4px}
.card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.today-date{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:700;background:var(--steelsoft);color:var(--steel);cursor:pointer}
.btn.paint{background:var(--paint);color:#fff}
.btn.big{width:100%;padding:15px;font-family:var(--display);font-size:21px;letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:none;color:var(--steel);padding:8px 6px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quick .btn{padding:13px 8px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--paint);background:var(--paintsoft);color:#8a3305;font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--steelsoft);color:var(--steel);white-space:nowrap}
.tag.lsi{background:#e6f0f7;color:#1f5f8b}.tag.pp{background:#fff0e6;color:#a64009}.tag.kompan{background:#e3f3e9;color:#1e7d45}
.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.good{background:var(--goodbg);color:var(--good)}
.list{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px}
.item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.tap{cursor:pointer}
.item .t{font-weight:700}
.check{width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:7px;background:#fff;display:grid;place-items:center;font-weight:700;color:#fff;cursor:pointer;margin-top:-1px}
.check.on{background:var(--good);border-color:var(--good)}
.done .t,.done .txt{text-decoration:line-through;color:var(--muted)}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:14px}
.seg{display:flex;background:#dde4e9;border-radius:11px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.jobcard{cursor:pointer}
.jobname{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05}
.bar{height:7px;background:#e3e9ed;border-radius:9px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--good)}
.stats{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-size:15px}
.back{display:inline-flex;gap:4px;align-items:center;border:0;background:none;color:var(--steel);font-weight:700;padding:4px 0 8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:15px}
.kv div:nth-child(odd){color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.addrow{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.addrow input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=url],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;font-size:16px}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.day{display:flex;gap:12px;align-items:center}
.daynum{width:46px;text-align:center;flex:none}
.daynum b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.daynum span{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700}
.istoday{background:var(--paintsoft)}
.istoday .daynum b{color:var(--paint)}
.sheetbg{position:fixed;inset:0;background:rgba(10,18,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-family:var(--display);font-size:24px;margin:0 0 4px}
.sheet .actions{display:flex;gap:8px;margin-top:16px}
.sheet .actions .btn{flex:1}
.mic{flex:none;width:48px;border:0;border-radius:10px;background:var(--paint);color:#fff;font-size:20px}
.mic.live{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.hit{font-size:14px}
.hit mark{background:#ffe08a;border-radius:3px}
.plan .item{align-items:center}
.plan .k{font-size:12px;color:var(--muted)}
.dayoff{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:700}
.wsum{background:var(--steelsoft);color:var(--steel);border-radius:10px;padding:10px 12px;font-weight:700;margin-top:12px}
.btag{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ===== Turf Tek look: same field, sun and grass as the Turf Tek calculator ===== */
:root{--brand:#86c440;--brand-d:#5f9b25;--sun:#e2e773;--forest:#10261a;--forest2:#1d4424;--green-l:#eef6e6;
  --bg:#f1f4ee;--panel:#fff;--ink:#16221a;--muted:#5f6d62;--line:#e3e9df;--paint:#73b02f;--paintsoft:#eef6e6;--steel:#2f6d2a;--steelsoft:#eef6e6;--good:#3f8f2f;--goodbg:#e6f3dc;
  --shadow:0 1px 2px rgba(16,38,26,.06),0 6px 20px rgba(16,38,26,.06);--body:Barlow,system-ui,sans-serif;
  --stripes:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 38px,rgba(0,0,0,.04) 38px 76px);
  --field:radial-gradient(120% 90% at 50% 0%,#2a5a2c 0%,#1d4424 45%,#10261a 100%)}
body{line-height:1.4}
.top{background:var(--stripes),var(--field);padding-bottom:14px;box-shadow:0 4px 18px rgba(16,38,26,.22)}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--sun),var(--brand))}
.top .mark{width:46px;height:auto;flex:none;margin:-4px -2px -2px -4px;overflow:visible}
.brand{letter-spacing:.06em;font-size:25px;line-height:1}
.brand b{color:var(--sun)}
.sub{margin-top:2px}
.iconbtn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:12px;width:42px;height:42px;font-size:20px;transition:transform .4s}
.iconbtn:active{transform:rotate(60deg)}
.tabs{background:rgba(16,38,26,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:0}
.tabs button{color:rgba(255,255,255,.55);position:relative;transition:color .2s}
.tabs button span{transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.tabs button.on{color:var(--sun)}
.tabs button.on span{transform:translateY(-2px) scale(1.12)}
.tabs button.on:before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:var(--brand);animation:tabIn .3s ease-out}
@keyframes tabIn{from{transform:scaleX(0)}to{transform:none}}
h2{color:var(--forest2)}
.card,.list{border:1px solid var(--line);border-radius:18px}
.jobname{color:var(--forest2)}
.btn{background:var(--green-l);color:var(--forest2);transition:transform .1s,box-shadow .15s,background .15s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.paint{background:linear-gradient(180deg,#8fcd48,#73b02f);color:var(--forest);box-shadow:0 6px 16px rgba(115,176,47,.35)}
.btn.paint:active{box-shadow:0 3px 8px rgba(115,176,47,.3)}
.btn.ghost{background:none;color:var(--brand-d);box-shadow:none}
.mic{background:linear-gradient(180deg,#8fcd48,#73b02f);color:var(--forest)}
.mic.live{animation:micPulse 1.1s ease-out infinite}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(134,196,64,.75)}100%{box-shadow:0 0 0 16px rgba(134,196,64,0)}}
.check{border-color:#cdd8c7;transition:background .15s,border-color .15s}
.check.on{background:var(--brand);border-color:var(--brand);color:var(--forest);animation:tick .35s cubic-bezier(.2,.9,.3,1.5)}
@keyframes tick{0%{transform:scale(.5)}100%{transform:none}}
.chip{transition:all .15s}
.chip.on{border-color:var(--brand);background:var(--green-l);color:var(--forest2)}
.seg{background:#e4ebe0;border-radius:12px}
.seg button{transition:all .15s}
.seg button.on{color:var(--forest2);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tag{background:var(--green-l);color:var(--forest2)}
.tag.lsi{background:#e6eef7;color:#24527a}.tag.pp{background:#fdf0e0;color:#8a4b06}.tag.kompan{background:#e6f3dc;color:#2f6d2a}
.bar{background:#e4ebe0}
.bar i{background:linear-gradient(90deg,var(--brand),var(--sun));transform-origin:left;animation:barIn 1s cubic-bezier(.3,0,.15,1)}
@keyframes barIn{from{transform:scaleX(0)}}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=url],select,textarea{border-color:#dbe3d7;background:#fbfcfa;border-radius:11px;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)!important;background:#fff;box-shadow:0 0 0 4px rgba(134,196,64,.2)}
.istoday{background:var(--green-l)}
.istoday .daynum b{color:var(--brand-d)}
.wsum{background:var(--forest2);color:#fff}
.hit mark{background:var(--sun)}
.toast{background:var(--forest2);box-shadow:0 6px 20px rgba(16,38,26,.3)}
/* today: the field card */
.hero-card{background:var(--stripes),var(--field);color:#fff;border:0;position:relative;overflow:hidden;padding-bottom:16px}
.hero-card:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--sun),var(--brand))}
.hero-card .sunbg{position:absolute;right:-34px;top:-30px;width:150px;height:150px;border-radius:50%;background:var(--sun);opacity:.13;animation:sunGrow .8s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes sunGrow{from{transform:scale(0)}to{transform:scale(1)}}
.hero-card>*:not(.sunbg){position:relative}
.hero-card .muted{color:rgba(255,255,255,.7)!important}
.hero-card .today-date{color:var(--sun)}
.hero-card .jobname{color:#fff}
.hero-card .btn.ghost{color:var(--sun)}
.hero-card .btn:not(.paint):not(.ghost){background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.14)}
.hero-card .tag.lsi,.hero-card .tag.pp,.hero-card .tag.kompan{background:rgba(255,255,255,.12);color:#fff}
/* motion */
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view.anim>*{animation:pop .4s ease-out both}
#view.anim>*:nth-child(2){animation-delay:.05s}#view.anim>*:nth-child(3){animation-delay:.1s}#view.anim>*:nth-child(4){animation-delay:.15s}
#view.anim>*:nth-child(5){animation-delay:.2s}#view.anim>*:nth-child(6){animation-delay:.25s}#view.anim>*:nth-child(n+7){animation-delay:.3s}
.sheetbg{animation:fadeIn .2s ease-out}
.sheet{animation:sheetUp .34s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* sun + grass mark */
.mk .sun{transform-box:fill-box;transform-origin:50% 100%}
.mk.play .sun{transform:scale(0);opacity:0;animation:sunUp .6s cubic-bezier(.2,.9,.3,1.25) .1s forwards}
.mk.play .ground{stroke-dasharray:1 1;stroke-dashoffset:1;animation:grow .5s ease-out .45s forwards}
.mk.play .g{stroke-dasharray:1 1;stroke-dashoffset:1}
.mk.play .g1{animation:grow .9s cubic-bezier(.3,0,.15,1) .55s forwards}
.mk.play .g2{animation:grow 1.1s cubic-bezier(.3,0,.15,1) .7s forwards}
.mk.play .g3{animation:grow .85s cubic-bezier(.3,0,.15,1) .9s forwards}
.mk .blades{transform-box:fill-box;transform-origin:50% 100%}
.mk.play .blades{animation:sway 5s ease-in-out 2.4s infinite}
@keyframes sunUp{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.6deg)}}
/* splash + day-wrapped screens */
.field{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:var(--stripes),var(--field);padding:30px 22px calc(30px + env(safe-area-inset-bottom));cursor:pointer}
.field:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--brand),var(--sun),var(--brand))}
.field .mk{width:min(240px,62vw);height:auto;overflow:visible}
.field h1,.field h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:6px 0 0;color:#fff}
.field h1{font-size:46px;line-height:.95}.field h1 b{color:var(--sun)}
.field h2{font-size:38px;line-height:1}
.field p{color:rgba(255,255,255,.8);margin:10px 0 0}
.field .fade{opacity:0;transform:translateY(8px);animation:pop .5s ease-out forwards}
.field.intro{transition:transform .6s cubic-bezier(.65,0,.25,1)}
.field.out{transform:translateY(-100%)}
.field.done{animation:fadeIn .35s ease-out}
.field.bye{opacity:0;transition:opacity .3s}
.field .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px;margin-top:22px}
.field .tiles div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 6px}
.field .tiles b{display:block;font-family:var(--display);font-size:32px;line-height:1.05;color:#fff}
.field .tiles div:first-child b{color:var(--sun)}
.field .tiles span{font-size:12px;color:rgba(255,255,255,.7)}
.field .btn.paint{margin-top:24px;max-width:420px;width:100%;font-size:18px}
.field .skip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;font-size:12.5px;color:rgba(255,255,255,.45)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<header class="top">
  <svg class="mark mk" viewBox="0 0 200 150" aria-hidden="true"></svg>
  <div><div class="brand">TURF TEK <b>JOBS</b></div><div class="sub" id="hdrSub"></div></div>
  <div class="sp"></div>
  <button class="iconbtn" id="gear" aria-label="Settings">⚙︎</button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="today"><span>☀︎</span>Today</button>
  <button data-tab="jobs"><span>▦</span>Jobs</button>
  <button data-tab="sched"><span>▤</span>Schedule</button>
  <button data-tab="brain"><span>⌕</span>Brain</button>
</nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
const LAYOUT_BASE='https://thepatrickreardon-sys.github.io/sawmill-layout/';
const KEY='hub_db';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const TODAY=()=>iso(new Date());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{if(!s)return'';const d=parseISO(s);return DOW[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate()};
const num=n=>Math.round(n*10)/10;

function seed(){
  const sec=names=>names.map(n=>({id:uid(),name:n,done:false}));
  return {v:1,crew:[],rem:[],sched:{},jobs:[
    {id:'sawmill',name:'Sawmill',mfr:'Play & Park',site:'',status:'active',start:'',contact:'',notes:'',layout:'',remKey:'swl_rem',sections:[],punch:[],logs:[],docs:[]},
    {id:'hagedorn',name:'Hagedorn',mfr:'Landscape Structures',site:'',status:'active',start:'',contact:'',notes:'',layout:'hagedorn/',remKey:'hgl_rem',sections:[],punch:[],logs:[],docs:[]},
    {id:'neary',name:'Neary Elementary',mfr:'Kompan',site:'',status:'active',start:'',contact:'',notes:'',layout:'neary/',remKey:'nry_rem',sections:[],punch:[],logs:[],docs:[]},
    {id:'bear-mountain',name:'Bear Mountain State Park',mfr:'Landscape Structures',site:'Tomkins Cove, NY',status:'upcoming',start:'',contact:'',notes:'~60 working days, 6-man crew. Bill by section.',layout:'bear-mountain/',remKey:'bm_rem',
      sections:sec(['Shades','Walkway','142" + embankment slides','Snag tower','23\' RPL tower + Adventurescapes + long slide','2–5 area','Misc / punch list']),punch:[],logs:[],docs:[]}
  ]};
}
let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!DB||!DB.jobs)DB=seed();
DB.crew??=[];DB.rem??=[];DB.sched??={};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Could not save on this device')}};
save();

const S={tab:'today',job:null,jtab:'overview',filter:'active',q:'',anim:true};
/* ---------- sun + grass mark (same shape as the Turf Tek logo) ---------- */
const MARK=`<defs><clipPath id="mkc"><rect x="0" y="0" width="200" height="138"/></clipPath></defs>

function splash(){

  const el=document.createElement('div');el.className='field intro';

  document.body.appendChild(el);

function wrapped(stats){
  const el=document.createElement('div');el.className='field done';
  el.innerHTML=`<svg class="mk play" viewBox="0 0 200 150">${MARK}</svg>
    <h2 class="fade" style="animation-delay:1.1s">${stats.moved?'Day wrapped':'Clean sweep'}</h2>

    <div class="tiles fade" style="animation-delay:1.35s"><div><b data-n="${stats.done}">0</b><span>done</span></div><div><b data-n="${stats.ahead}">0</b><span>ahead of plan</span></div><div><b data-n="${stats.moved}">0</b><span>${stats.next?'to '+esc(stats.next):'moved on'}</span></div></div>
    <button class="btn paint big fade" style="animation-delay:1.5s">Done</button>`;
  document.body.appendChild(el);
  setTimeout(()=>el.querySelectorAll('[data-n]').forEach(b=>{const n=+b.dataset.n,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/700);b.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}),1400);
  const bye=()=>{el.classList.add('bye');setTimeout(()=>el.remove(),300)};el.onclick=bye;
}
const job=id=>DB.jobs.find(j=>j.id===id);
const layoutURL=j=>j.layout===null||j.layout===undefined?null:(/^https?:/.test(j.layout)?j.layout:LAYOUT_BASE+j.layout);
const mfrTag=m=>{const k=/kompan/i.test(m)?'kompan':/landscape|lsi/i.test(m)?'lsi':/play|park|supermax/i.test(m)?'pp':'';return m?`<span class="tag ${k}">${esc(m)}</span>`:''};
const manHours=l=>(Number(l.hours)||0)*Math.max(1,(l.crew||[]).length);
const jobHours=j=>j.logs.reduce((a,l)=>a+manHours(l),0);
function layoutRems(j){
  if(!j.remKey)return[];
  try{return (JSON.parse(localStorage.getItem(j.remKey))||[]).filter(r=>r&&!r.done&&r.text)}catch(e){return[]}
}
function dayPlan(d){return DB.sched[d]||{}}
/* ---------- build plan shared with the layout apps (same site, same phone) ---------- */
const PFX={sawmill:'swl_',hagedorn:'hgl_',neary:'nry_','bear-mountain':'bm_'};
const pfx=j=>j&&(j.pfx??PFX[j.id]??null);
function getPlan(j){const p=pfx(j);if(!p)return null;try{const P=JSON.parse(localStorage.getItem(p+'build'));if(P&&Array.isArray(P.days)&&P.days.length){P.off=Array.isArray(P.off)?P.off:[];P.days.forEach(d=>{d.items=d.items||[];d.done=d.done||[]});return P}}catch(e){}return null}
function setPlan(j,P){try{localStorage.setItem(pfx(j)+'build',JSON.stringify(P))}catch(e){toast('Could not save the plan')}}
function names(j){try{return JSON.parse(localStorage.getItem(pfx(j)+'build_names'))||{}}catch(e){return{}}}
const iname=(N,k)=>(N[k]&&N[k].n)||k;
const hasItems=P=>P&&P.days.some(d=>d.items.length);
function pDate(P,i){if(!P||!P.start)return null;const d=parseISO(P.start);let n=-1;for(let g=0;g<1500;g++){const s=iso(d),wd=d.getDay();if(wd&&wd!==6&&!P.off.includes(s)){n++;if(n===i)return s}d.setDate(d.getDate()+1)}return null}
function pIndex(P,dt){if(!P||!P.start||dt<P.start)return -1;for(let i=0;i<P.days.length;i++){const s=pDate(P,i);if(!s||s>dt)return -1;if(s===dt)return i}return -1}
function buildJobsOn(dt){return DB.jobs.filter(j=>j.status!=='done').map(j=>{const P=getPlan(j);const i=pIndex(P,dt);return i<0?null:{j,P,i}}).filter(Boolean)}
function isOff(dt){return DB.jobs.some(j=>{const P=getPlan(j);return P&&P.off.includes(dt)})}
function setOff(dt,on){DB.jobs.filter(j=>j.status!=='done').forEach(j=>{const P=getPlan(j);if(!P||!P.start||dt<P.start)return;const has=P.off.includes(dt);if(on&&!has)P.off.push(dt);if(!on&&has)P.off=P.off.filter(x=>x!==dt);setPlan(j,P)})}
function todayJob(){const p=dayPlan(TODAY());return job(p.job)||(buildJobsOn(TODAY())[0]||{}).j||null}

/* ---------- understand what was said ---------- */
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60};
function normT(s){return ' '+String(s).toLowerCase().replace(/[-–_\/]/g,' ').replace(/[^a-z0-9'\s]/g,' ').replace(/\b(twenty|thirty|forty|fifty|sixty)\s+(one|two|three|four|five|six|seven|eight|nine)\b/g,(m,a,b)=>NUMW[a]+NUMW[b]).replace(/\b[a-z]+\b/g,w=>NUMW[w]!=null?NUMW[w]:w).replace(/\s+/g,' ').replace(/\b(?!(?:to|at|on|of|in|is|it|no|so|up|we|or|by|an|as|be|do|go|he|if|me|my|us|and)\b)([a-z]{1,2}) (\d+)\b/g,'$1$2')+' '}
const NEG=/\b(didn'?t|did not|not|no|never|couldn'?t|could not|still|need|needs|tomorrow|wasn'?t|haven'?t|hasn'?t|left|missing|waiting)\b/;
function sameHole(a,b){a=String(a).toLowerCase();b=String(b).toLowerCase();if(a===b)return true;const ra=a.match(/^([a-z]*)0*(\d+)$/),rb=b.match(/^([a-z]*)0*(\d+)$/);return !!(ra&&rb&&ra[2]===rb[2]&&(ra[1]===rb[1]||!rb[1]))}
function matchSpoken(text,N){
  const hits=new Set(),E=Object.entries(N);
  let lastKw='',lastNeg=false;
  for(const raw of String(text).split(/[.;!?\n,]+|\s+but\s+|\s+except\s+|\s+however\s+/i)){
    let c=normT(raw);if(!c.trim())continue;
    const cont=/^\s*(and\s+)?[a-z]{0,2}\d/.test(c);
    if(cont&&lastKw)c=' '+lastKw+c.replace(/^\s*and\s+/,' ');
    const neg=cont?lastNeg||NEG.test(c):NEG.test(c);
    const kw=c.match(/\b(poles?|holes?|posts?|footings?)\s+[a-z]{0,2}\d/);if(kw)lastKw=kw[1];else if(!cont)lastKw='';
    lastNeg=neg;if(neg)continue;
    const foot=/footing|pour|concrete|slab|pad/.test(c);
    const re=/\b(poles?|holes?|posts?|footings?)\s+((?:[a-z]{0,2}\d+)(?:\s+(?:and|through|thru|to|n)?\s*[a-z]{0,2}\d+)*)/g;let m;
    while((m=re.exec(c))){const toks=m[2].split(/\s+/).filter(Boolean),nums=[],fill=new Set();
      for(let i=0;i<toks.length;i++){const t=toks[i];
        if(/^(through|thru|to)$/.test(t)&&nums.length&&toks[i+1]){const last=nums[nums.length-1],pre=(last.match(/^[a-z]*/)||[''])[0],a=parseInt(last.replace(/\D/g,'')),b=parseInt(toks[i+1].replace(/\D/g,''));if(b>a&&b-a<60)for(let x=a+1;x<b;x++){nums.push(pre+x);fill.add(pre+x)}nums.push(toks[i+1]);i++}
        else if(/\d/.test(t))nums.push(t)}
      const wantFoot=foot&&!/^pole|^post/.test(m[1]);
      const exact=(a,b)=>{const ra=String(a).toLowerCase().match(/^([a-z]*)0*(\d+)$/),rb=String(b).toLowerCase().match(/^([a-z]*)0*(\d+)$/);return ra&&rb?ra[1]===rb[1]&&ra[2]===rb[2]:String(a).toLowerCase()===String(b).toLowerCase()};
      for(const n of nums){
        const holesOf=v=>wantFoot?(v.t==='foot'?(v.hs||[]):[]):(v.t==='pole'?[v.h]:[]);
        let got=E.filter(([k,v])=>holesOf(v).some(h=>exact(h,n)));
        if(!got.length&&!fill.has(n))got=E.filter(([k,v])=>holesOf(v).some(h=>sameHole(h,n)));
        got.forEach(([k])=>hits.add(k))}}
    for(const [k,v] of E){if(v.t==='pole')continue;const core=normT(String(v.n).replace(/\(.*?\)/g,'')).trim();if(!core)continue;
      if(c.includes(' '+core+' ')){hits.add(k);continue}
      const w=core.split(' ');if(w.length>2){const sh=w.slice(0,2).join(' ');if((/\d/.test(w[1])||sh.length>=7)&&c.includes(' '+sh+' '))hits.add(k)}}
  }
  return hits;
}

/* ---------- end of day: what we planned vs what we did ---------- */
function wrapUp(j,dt){
  dt=dt||TODAY();let P=getPlan(j);const i=pIndex(P,dt);if(i<0)return toast('No build day on '+fmt(dt));
  const N=names(j),D=P.days[i];
  const prev=j.logs.find(l=>l.date===dt&&l.build);
  const planned=[...new Set([...(prev?prev.build.planned:[]),...D.items])];
  const extra=new Set((prev?prev.build.extra:[]).filter(k=>!planned.includes(k)));
  const done=new Set(D.done.filter(k=>planned.includes(k)));
  const base=prev||{crew:[...(dayPlan(dt).crew||[])],hours:8,note:''};
  const nextD=pDate(P,i+1);
  const others=()=>{const inPlan=new Set(P.days.flatMap(d=>d.items));const later=P.days.flatMap((d,di)=>di>i?d.items.filter(k=>!d.done.includes(k)):[]);const un=Object.keys(N).filter(k=>!inPlan.has(k));return [...later,...un].filter(k=>!planned.includes(k)&&!extra.has(k))};
  sheet(`<h3>Wrap up · ${fmt(dt)}</h3><div class="muted small">${esc(j.name)} · Build day ${i+1}</div>
    <label class="f">What did you get done? Just talk.</label>
    <div class="row" style="align-items:stretch"><textarea id="wt" placeholder="Set poles 12 through 15, deck 3 is on, didn't get to the slide">${esc(base.note)}</textarea><button class="mic" id="wm">🎤</button></div>
    <div class="small muted" id="wmsg" style="margin-top:5px">I check off what you name. Anything you say you didn't get to stays unchecked.</div>
    <label class="f">Planned for today</label><div class="list plan" id="wp"></div>
    <label class="f">Also got done</label><div class="list plan" id="wx"></div>
    <select id="wadd"></select>
    <label class="f">Crew on site</label><div class="row wrap" id="wc">${DB.crew.length?DB.crew.map(c=>`<button class="chip${base.crew.includes(c)?' on':''}">${esc(c)}</button>`).join(''):'<span class="muted small">Add your crew in ⚙︎ Settings</span>'}</div>
    <label class="f">Hours on site (each)</label><input type="number" id="wh" inputmode="decimal" step="0.5" value="${base.hours}">
    <div class="wsum" id="wsum"></div>
    <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn paint" id="wsv">Save the day</button></div>`,
  (el,close)=>{
    const crew=new Set(base.crew);
    el.querySelectorAll('#wc .chip').forEach(b=>b.onclick=()=>{const n=b.textContent;crew.has(n)?crew.delete(n):crew.add(n);b.classList.toggle('on')});
    const row=(k,on,attr)=>`<div class="item"><button class="check ${on?'on':''}" ${attr}="${esc(k)}">${on?'✓':''}</button><div class="grow"><div class="txt">${esc(iname(N,k))}</div>${N[k]&&N[k].s?`<div class="k">${esc(N[k].s)}</div>`:''}</div></div>`;
    const draw=()=>{
      el.querySelector('#wp').innerHTML=planned.map(k=>row(k,done.has(k),'data-wp')).join('')||'<div class="empty">Nothing was planned for today.</div>';
      el.querySelector('#wx').innerHTML=[...extra].map(k=>row(k,true,'data-wx')).join('')||'<div class="empty">Name anything from a later day and it shows up here.</div>';
      el.querySelector('#wadd').innerHTML='<option value="">＋ Add something else we did…</option>'+others().map(k=>`<option value="${esc(k)}">${esc(iname(N,k))}</option>`).join('');
      const left=planned.filter(k=>!done.has(k)).length;
      el.querySelector('#wsum').textContent=`${done.size+extra.size} done${extra.size?` (${extra.size} ahead of plan)`:''} · ${left?`${left} move${left===1?'s':''} to ${nextD?fmt(nextD):'the next day'}`:'nothing carries over'}`;
      el.querySelectorAll('[data-wp]').forEach(b=>b.onclick=()=>{const k=b.dataset.wp;done.has(k)?done.delete(k):done.add(k);draw()});
      el.querySelectorAll('[data-wx]').forEach(b=>b.onclick=()=>{extra.delete(b.dataset.wx);draw()});
    };
    el.querySelector('#wadd').onchange=e=>{if(e.target.value){extra.add(e.target.value);draw()}};
    const t=el.querySelector('#wt');
    const listen=()=>{const h=matchSpoken(t.value,N);let n=0;h.forEach(k=>{if(planned.includes(k)){if(!done.has(k)){done.add(k);n++}}else if(!extra.has(k)&&!P.days.some((d,di)=>di<i&&d.done.includes(k))){extra.add(k);n++}});
      el.querySelector('#wmsg').textContent=n?`Checked off ${n} from what you said. Fix anything that's wrong below.`:'I check off what you name. Anything you say you didn\'t get to stays unchecked.';draw()};
    let tm;t.oninput=()=>{clearTimeout(tm);tm=setTimeout(listen,500)};
    micFor(el.querySelector('#wm'),t);
    draw();
    el.querySelector('#wsv').onclick=()=>{
      P=getPlan(j);const D=P.days[i];
      const move=[...planned,...extra];
      P.days.forEach((d,di)=>{if(di!==i){d.items=d.items.filter(k=>!move.includes(k));d.done=d.done.filter(k=>!move.includes(k))}});
      const didK=[...planned.filter(k=>done.has(k)),...extra];
      const rolled=planned.filter(k=>!done.has(k));
      D.items=[...didK,...D.items.filter(k=>!move.includes(k))];D.done=[...new Set([...didK,...D.done.filter(k=>D.items.includes(k)&&!move.includes(k))])];
      const stillOpen=D.items.filter(k=>!D.done.includes(k));
      const carry=[...rolled,...stillOpen];
      if(carry.length){D.items=D.items.filter(k=>!carry.includes(k));if(!P.days[i+1])P.days.push({items:[],done:[]});const nx=P.days[i+1];nx.items=[...carry,...nx.items.filter(k=>!carry.includes(k))]}
      setPlan(j,P);
      const nm={};[...planned,...extra].forEach(k=>nm[k]=iname(N,k));
      j.logs=j.logs.filter(l=>!(l.date===dt&&l.build));
      j.logs.push({id:uid(),date:dt,crew:[...crew],hours:Number(el.querySelector('#wh').value)||0,section:'',note:t.value.trim(),made:Date.now(),
        build:{day:i+1,planned,done:planned.filter(k=>done.has(k)),rolled:carry,extra:[...extra],names:nm}});
      save();close();render();
      wrapped({job:j.name,day:i+1,done:didK.length,ahead:extra.size,moved:carry.length,next:carry.length&&nextD?fmt(nextD):''});
    };
  });
}
function planCard(j,dt){
  const P=getPlan(j);if(!P||!hasItems(P))return'';
  const lu=layoutURL(j);
  if(!P.start)return `<div class="card"><div class="t" style="font-weight:700">Build plan for ${esc(j.name)}</div><div class="small muted" style="margin:4px 0 8px">Set the date for Day 1 and every build day gets a real date. Weekends are skipped.</div><input type="date" data-pstart="${j.id}"></div>`;
  if(P.off.includes(dt))return `<div class="card"><div class="dayoff">Not working today. Build days slid back one workday.</div><button class="btn ghost" data-unoff="${dt}">Undo, we're working</button></div>`;
  const i=pIndex(P,dt);
  if(i<0){let n=null;for(let k=0;k<P.days.length;k++){const s=pDate(P,k);if(s&&s>dt){n={k,s};break}}
    return `<div class="card"><div class="muted">No build day today for ${esc(j.name)}.${n?` Next up: <b>Build day ${n.k+1}</b>, ${fmt(n.s)}.`:''}</div></div>`}
  const N=names(j),D=P.days[i],wrapped=j.logs.some(l=>l.date===dt&&l.build);
  return `<h2>Today's plan · Build day ${i+1}</h2>
  <div class="list plan">${D.items.map((k,n)=>{const on=D.done.includes(k);return `<div class="item ${on?'done':''}"><button class="check ${on?'on':''}" data-bitem="${j.id}|${i}|${esc(k)}">${on?'✓':''}</button><div class="grow"><div class="txt"><b>${n+1}.</b> ${esc(iname(N,k))}</div>${N[k]&&N[k].s?`<div class="k">${esc(N[k].s)}</div>`:''}</div></div>`}).join('')||'<div class="empty">Nothing picked for today. Plan it in the layout app.</div>'}
    <div class="addrow small muted" style="justify-content:space-between"><span>${D.done.length}/${D.items.length} done</span>${lu?`<a href="${esc(lu)}#build" style="color:var(--steel);font-weight:700">Edit in layout ›</a>`:''}</div></div>
  <button class="btn paint big" data-wrap="${j.id}">🎤 ${wrapped?'Redo wrap-up':'Wrap up the day'}</button>
  <button class="btn ghost" style="width:100%;margin-top:4px" data-off="${dt}">Not working today (rain / off)</button>`;
}
function planSummary(j){
  const P=getPlan(j);const pf=pfx(j);if(!pf)return'';
  const lu=layoutURL(j);
  if(!hasItems(P))return `<h2>Build plan</h2><div class="card small muted">No build days picked yet. Open the layout app, go to Build days, and tap poles, decks and parts for each day.${lu?` <a href="${esc(lu)}#build" style="color:var(--steel);font-weight:700">Open Build days ›</a>`:''}</div>`;
  const N=names(j),t=TODAY();
  const wl=j.logs.filter(l=>l.build),pl=wl.reduce((a,l)=>a+l.build.planned.length,0),dn=wl.reduce((a,l)=>a+l.build.done.length+l.build.extra.length,0);
  const total=P.days.reduce((a,d)=>a+d.items.length,0),doneAll=P.days.reduce((a,d)=>a+d.done.length,0);
  const last=pDate(P,P.days.length-1);
  return `<h2>Build plan</h2>
  <div class="card"><div class="row"><label class="grow small" style="font-weight:700;color:var(--muted)">Day 1 is<input type="date" data-pstart="${j.id}" value="${P.start||''}" style="margin-top:5px"></label></div>
    <div class="stats" style="margin-top:10px"><span><b>${doneAll}/${total}</b> items done</span><span><b>${P.days.length}</b> build days</span>${last?`<span>Finish <b>${fmt(last)}</b></span>`:''}</div>
    ${wl.length?`<div class="small" style="margin-top:8px">Wrapped ${wl.length} day${wl.length===1?'':'s'}: planned <b>${pl}</b>, got done <b>${dn}</b> → <b style="color:${dn>=pl?'var(--good)':'var(--bad)'}">${dn===pl?'right on plan':dn>pl?`${dn-pl} ahead`:`${pl-dn} behind`}</b></div>`:''}
    ${lu?`<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="${esc(lu)}#build">Edit build days in layout ›</a>`:''}</div>
  <div class="list">${P.days.map((d,i)=>{const s=pDate(P,i);const l=j.logs.find(x=>x.build&&x.date===s);return `<div class="item ${s===t?'istoday':''}"><div class="daynum" style="width:52px"><span>Day</span><b>${i+1}</b></div><div class="grow"><div class="t">${s?fmt(s):'No date yet'}</div><div class="small muted">${d.items.slice(0,4).map(k=>esc(iname(N,k))).join(', ')}${d.items.length>4?` +${d.items.length-4} more`:''}</div>${l?`<div class="btag"><span class="tag good">Did ${l.build.done.length+l.build.extra.length}</span>${l.build.rolled.length?`<span class="tag warn">${l.build.rolled.length} moved on</span>`:''}</div>`:''}</div><span class="tag ${d.done.length===d.items.length&&d.items.length?'good':''}">${d.done.length}/${d.items.length}</span></div>`}).join('')}</div>`;
}

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- bottom sheet ---------- */
function sheet(html,mount){
  const bg=document.createElement('div');bg.className='sheetbg';
  bg.innerHTML=`<div class="sheet">${html}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)close()});
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  mount&&mount(bg.querySelector('.sheet'),close);
  return close;
}

/* ---------- dictation ---------- */
function micFor(btn,input){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  btn.onclick=()=>{
    if(!SR){input.focus();toast('Tap the mic on your keyboard to talk');return}
    const r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=false;
    btn.classList.add('live');
    r.onresult=e=>{input.value=Array.from(e.results).map(x=>x[0].transcript).join(' ');input.dispatchEvent(new Event('input'))};
    r.onend=()=>btn.classList.remove('live');
    r.onerror=()=>{btn.classList.remove('live');input.focus()};
    r.start();
  };
}

    <h2>By day</h2><div class="card"><table><tr><th>Day</th><th class="n">Man-hrs</th></tr>${Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>`<tr><td>${fmt(k)}</td><td class="n">${num(v)}</td></tr>`).join('')||'<tr><td colspan=2 class="muted">Nothing logged yet</td></tr>'}</table></div>`;
  }
  return `<button class="back" id="back">‹ All jobs</button>
  <div class="row" style="margin-bottom:10px"><div class="grow"><div class="jobname" style="font-size:30px">${esc(j.name)}</div><div class="row wrap" style="margin-top:4px">${mfrTag(j.mfr)}<span class="tag ${j.status==='active'?'good':j.status==='done'?'':'warn'}">${{active:'Active',upcoming:'Upcoming',done:'Completed'}[j.status]}</span></div></div></div>
  <div class="seg">${tabs.map(([v,t])=>`<button data-jtab="${v}" class="${S.jtab===v?'on':''}">${t}</button>`).join('')}</div>${body}`;
}
function vSched(){
  const t=TODAY();const start=addDays(t,-((parseISO(t).getDay()+6)%7)); // this Monday
  const days=[...Array(21)].map((_,i)=>addDays(start,i));
  let out='',wk=-1;
  days.forEach((d,i)=>{
    if(Math.floor(i/7)!==wk){wk=Math.floor(i/7);out+=(out?'</div>':'')+`<h2>${['This week','Next week','In 2 weeks'][wk]}</h2><div class="list">`}
    const p=DB.sched[d]||{},bj=buildJobsOn(d),jj=job(p.job)||(bj[0]||{}).j,dd=parseISO(d),off=isOff(d);
    const bl=bj.map(b=>{const D=b.P.days[b.i];return `<div class="small"><span class="tag">Build day ${b.i+1}</span> ${D.items.length} item${D.items.length===1?'':'s'}${D.done.length?` · ${D.done.length} done`:''}</div>`}).join('');
    out+=`<div class="item tap day ${d===t?'istoday':''}" data-day="${d}"><div class="daynum"><span>${DOW[dd.getDay()]}</span><b>${dd.getDate()}</b></div><div class="grow">${off?'<div class="t" style="color:var(--warn)">Day off</div>':jj?`<div class="t">${esc(jj.name)}</div>${bl}`:`<div class="muted">${dd.getDay()%6===0?'Weekend':'—'}</div>`}${p.note?`<div class="small">${esc(p.note)}</div>`:''}${p.crew&&p.crew.length?`<div class="small muted">${p.crew.map(esc).join(', ')}</div>`:''}</div><span class="muted">›</span></div>`;
  });
  return out+'</div>';
}
function vBrain(){
  const q=S.q.trim().toLowerCase();
  let res='';
  if(q){
    const hits=[];const m=s=>s&&String(s).toLowerCase().includes(q);
    DB.jobs.forEach(j=>{
      if(m(j.name)||m(j.site)||m(j.notes)||m(j.contact)||m(j.mfr))hits.push({j,type:'Job',text:[j.site,j.notes,j.contact].filter(Boolean).join(' · ')||j.mfr});
      j.sections.forEach(s=>m(s.name)&&hits.push({j,type:'Section',text:`${s.name} — ${num(j.logs.filter(l=>l.section===s.name).reduce((a,l)=>a+manHours(l),0))} man-hrs${s.done?' (done)':''}`}));
      j.logs.forEach(l=>(m(l.note)||m(l.section)||l.crew.some(m))&&hits.push({j,type:'Log',date:l.date,text:`${l.section?l.section+': ':''}${l.note} (${num(manHours(l))} man-hrs)`}));
      j.logs.forEach(l=>l.build&&Object.entries(l.build.names||{}).forEach(([k,n])=>m(n)&&hits.push({j,type:l.build.done.includes(k)||l.build.extra.includes(k)?'Built':'Moved on',date:l.date,text:n})));
      j.punch.forEach(p=>m(p.text)&&hits.push({j,type:p.done?'Punch (done)':'Punch',text:p.text}));
      layoutRems(j).forEach(r=>m(r.text)&&hits.push({j,type:'Layout reminder',text:r.text}));
    });
    DB.rem.forEach(r=>m(r.text)&&hits.push({j:job(r.job),type:r.done?'Reminder (done)':'Reminder',text:r.text}));
    const hl=s=>esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),x=>`<mark>${x}</mark>`);
    res=`<div class="list">${hits.slice(0,80).map(h=>`<div class="item ${h.j?'tap':''} hit" ${h.j?`data-openjob="${h.j.id}"`:''}><div class="grow"><div class="row wrap small" style="margin-bottom:3px"><span class="tag">${esc(h.type)}</span>${h.j?`<b>${esc(h.j.name)}</b>`:''}${h.date?`<span class="muted">${fmt(h.date)}</span>`:''}</div>${hl(h.text)}</div></div>`).join('')||'<div class="empty">Nothing found across your jobs.</div>'}</div>`;
  }else{
    const secs={};DB.jobs.forEach(j=>j.logs.forEach(l=>{if(!l.section)return;const k=l.section.toLowerCase();secs[k]??={name:l.section,h:0,jobs:new Set};secs[k].h+=manHours(l);secs[k].jobs.add(j.name)}));
    const totalH=DB.jobs.reduce((a,j)=>a+jobHours(j),0);
    res=`<h2>Every job</h2><div class="card" style="padding:6px 10px"><table><tr><th>Job</th><th class="n">Days</th><th class="n">Man-hrs</th><th class="n">Punch</th></tr>
      ${DB.jobs.map(j=>`<tr data-openjob="${j.id}" style="cursor:pointer"><td><b>${esc(j.name)}</b><div class="small muted">${{active:'Active',upcoming:'Upcoming',done:'Completed'}[j.status]}</div></td><td class="n">${new Set(j.logs.map(l=>l.date)).size}</td><td class="n">${num(jobHours(j))}</td><td class="n">${j.punch.filter(p=>!p.done).length}</td></tr>`).join('')}
      <tr><td><b>All jobs</b></td><td></td><td class="n"><b>${num(totalH)}</b></td><td></td></tr></table></div>
    ${(()=>{const rows=DB.jobs.map(j=>{const wl=j.logs.filter(l=>l.build);if(!wl.length)return'';const pl=wl.reduce((a,l)=>a+l.build.planned.length,0),dn=wl.reduce((a,l)=>a+l.build.done.length+l.build.extra.length,0),rl=wl.reduce((a,l)=>a+l.build.rolled.length,0);return `<tr data-openjob="${j.id}" style="cursor:pointer"><td><b>${esc(j.name)}</b><div class="small muted">${wl.length} days wrapped</div></td><td class="n">${pl}</td><td class="n">${dn}</td><td class="n" style="color:${dn>=pl?'var(--good)':'var(--bad)'}">${dn>=pl?'+':''}${dn-pl}</td></tr>`}).join('');
      return `<h2>Planned vs. did</h2><div class="card" style="padding:6px 10px">${rows?`<table><tr><th>Job</th><th class="n">Planned</th><th class="n">Did</th><th class="n">±</th></tr>${rows}</table>`:'<div class="empty">Wrap up a build day and this shows what you planned against what got done.</div>'}</div>`})()}
    <h2>What things really take</h2>
    <div class="card" style="padding:6px 10px">${Object.keys(secs).length?`<table><tr><th>Section</th><th class="n">Man-hrs</th></tr>${Object.values(secs).sort((a,b)=>b.h-a.h).map(s=>`<tr><td>${esc(s.name)}<div class="small muted">${[...s.jobs].map(esc).join(', ')}</div></td><td class="n">${num(s.h)}</td></tr>`).join('')}</table>`:'<div class="empty">Log days with a section picked and this fills in with real hours for towers, slides, shades… the numbers you bid from.</div>'}</div>`;
  }
  return `<input type="search" id="q" placeholder="Search every job: RPL tower, concrete, Kompan…" value="${esc(S.q)}" style="margin-bottom:10px">${res}`;
}

/* ---------- render + events ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const active=DB.jobs.filter(j=>j.status==='active').length;
  $('#hdrSub').textContent=`${active} active job${active===1?'':'s'}`;
  const v=$('#view');
  v.innerHTML=S.tab==='today'?vToday():S.tab==='jobs'?vJobs():S.tab==='sched'?vSched():vBrain();
  v.classList.remove('anim');if(S.anim){void v.offsetWidth;v.classList.add('anim')}S.anim=false;
  bind(v);
}
function bind(v){
  const on=(sel,fn)=>v.querySelectorAll(sel).forEach(el=>el.addEventListener('click',e=>fn(el,e)));
  on('[data-openjob]',el=>{S.anim=true;S.tab='jobs';S.job=el.dataset.openjob;S.jtab='overview';render();scrollTo(0,0)});
  on('[data-day]',el=>editDay(el.dataset.day));
  on('[data-rem]',el=>{const r=DB.rem.find(x=>x.id===el.dataset.rem);r.done=true;r.doneAt=Date.now();save();el.classList.add('on');el.textContent='✓';setTimeout(render,350);toast('Done')});
  on('[data-filter]',el=>{S.anim=true;S.filter=el.dataset.filter;render()});
  on('[data-jtab]',el=>{S.anim=true;S.jtab=el.dataset.jtab;render()});
  const j=S.job&&job(S.job);
  on('[data-sec]',el=>{const s=j.sections.find(x=>x.id===el.dataset.sec);s.done=!s.done;save();render()});
  on('[data-delsec]',el=>{const s=j.sections.find(x=>x.id===el.dataset.delsec);if(confirm(`Remove section "${s.name}"?`)){j.sections=j.sections.filter(x=>x!==s);save();render()}});
  on('[data-punch]',el=>{const p=j.punch.find(x=>x.id===el.dataset.punch);p.done=!p.done;save();render()});
  on('[data-delpunch]',el=>{j.punch=j.punch.filter(x=>x.id!==el.dataset.delpunch);save();render()});
  on('[data-deldoc]',el=>{j.docs.splice(+el.dataset.deldoc,1);save();render()});
  on('[data-log]',el=>{const l=j.logs.find(x=>x.id===el.dataset.log);if(l.build&&getPlan(j)&&pIndex(getPlan(j),l.date)>=0)wrapUp(j,l.date);else addLog(j.id,l)});
  on('[data-bitem]',el=>{const [jid,i,k]=el.dataset.bitem.split('|');const jj=job(jid),P=getPlan(jj),D=P.days[+i];D.done.includes(k)?D.done=D.done.filter(x=>x!==k):D.done.push(k);setPlan(jj,P);render()});
  on('[data-wrap]',el=>wrapUp(job(el.dataset.wrap)));
  on('[data-off]',el=>{if(confirm('Mark this as a day off? Every build day from here on slides back one workday.')){setOff(el.dataset.off,true);render();toast('Build days slid back a day')}});
  on('[data-unoff]',el=>{setOff(el.dataset.unoff,false);render()});
  v.querySelectorAll('[data-pstart]').forEach(el=>el.onchange=()=>{const jj=job(el.dataset.pstart),P=getPlan(jj);P.start=el.value||null;setPlan(jj,P);render();toast(el.value?'Build days now have dates':'Dates cleared')});
  const id=(x,fn)=>{const el=v.querySelector('#'+x);if(el)el.onclick=fn};
  id('setday',()=>editDay(TODAY()));
  id('qrem',()=>addReminder(undefined,true));id('qsched',()=>{S.tab='sched';render();scrollTo(0,0)});
  id('qlog',()=>addLog(todayJob()?.id));id('qpunch',()=>addPunch());
  id('newjob',()=>editJob());id('editjob',()=>editJob(j));
  id('back',()=>{S.anim=true;S.job=null;render()});
  id('addpunch',()=>addPunch(j.id));id('addlog',()=>addLog(j.id));
  id('adddoc',()=>{const name=prompt('Name (e.g. Install manual, Site plan)');if(!name)return;const url=prompt('Link (paste the URL)');if(!url)return;j.docs.push({name,url});save();render()});
  const sa=v.querySelector('#seca');if(sa){const inp=v.querySelector('#secn');const add=()=>{const n=inp.value.trim();if(!n)return;j.sections.push({id:uid(),name:n,done:false});save();render()};sa.onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add()}}
  const q=v.querySelector('#q');if(q){q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.anim=true;if(S.tab===b.dataset.tab&&b.dataset.tab==='jobs')S.job=null;S.tab=b.dataset.tab;render();scrollTo(0,0)});
$('#gear').onclick=settings;
splash();
addEventListener('storage',render);
addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
