<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turf Tek Contractor Portal — Demo</title>
<meta name="theme-color" content="#22372B">
<style>
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-Medium.woff2') format('woff2');font-weight:500 600;font-display:swap}
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-Black.woff2') format('woff2');font-weight:800 900;font-display:swap}
@font-face{font-family:'Giften';src:url('assets/fonts/Giften.woff') format('woff');font-weight:400;font-display:swap}
:root{--ds:#22372B;--ds2:#14211B;--vf:#86C53F;--fb:#E2E872;--mist:#CFE4B1;--gold:#D6A461;--brown:#8B5B29;--ink:#22372B;--mute:#4E6357;--line:#E1E8D6;--tint:#F4F8EE;--red:#c63b2d;
  --head:'Giften',Georgia,serif;--body:'Satoshi',system-ui,-apple-system,'Segoe UI',sans-serif;--ease:cubic-bezier(.22,.8,.24,1);--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);background:var(--tint);line-height:1.5;font-size:16px;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);font-weight:400;line-height:1.15}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font-weight:700;padding:.8em 1.3em;border-radius:13px;transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .25s,opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-v{background:var(--vf);color:var(--ds);box-shadow:0 8px 22px -10px rgba(134,197,63,.75)}
.btn-d{background:var(--ds);color:#fff}
.btn-l{background:#fff;border:1.5px solid var(--line);color:var(--ds)}
.btn-sm{padding:.55em .95em;font-size:.9rem;border-radius:10px}
.eye{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--vf)}
.mute{color:var(--mute)}
.demo-bar{background:var(--gold);color:var(--ds);font-size:.8rem;font-weight:700;text-align:center;padding:6px 10px}
.field{display:grid;gap:6px}
.field label{font-size:.82rem;font-weight:700;color:var(--mute)}
.inp{width:100%;padding:.8em 1em;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:1rem;transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--vf);box-shadow:0 0 0 4px rgba(134,197,63,.18)}

/* ---------- login ---------- */
.login{min-height:calc(100vh - 31px);display:grid;grid-template-columns:1.1fr .9fr;background:var(--ds);color:#fff;position:relative;overflow:hidden}
.login .l{padding:clamp(28px,6vw,80px);display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.login .l img{height:62px;width:auto;align-self:flex-start;margin-bottom:46px}
.login h1{font-size:clamp(2.4rem,5vw,4rem)}
.login h1 span{color:var(--fb);display:block}
.login .l p{color:var(--mist);max-width:460px;margin-top:16px;font-size:1.08rem}
.login .perks{list-style:none;display:grid;gap:10px;margin-top:28px;color:#fff}
.login .perks li::before{content:"✓";color:var(--vf);font-weight:900;margin-right:10px}
.login .r{display:grid;place-items:center;padding:28px;position:relative;z-index:1}
.lcard{background:#fff;color:var(--ink);border-radius:22px;padding:34px;width:min(420px,100%);box-shadow:0 40px 80px -30px rgba(0,0,0,.6);display:grid;gap:16px;animation:rise .8s var(--ease) both .2s}
.lcard h2{font-size:1.9rem}
.lcard .err{color:var(--red);font-size:.9rem;min-height:1.2em}
.lcard .shake{animation:shake .45s}
.hint{background:var(--tint);border-radius:12px;padding:12px 14px;font-size:.84rem;color:var(--mute)}
.hint b{color:var(--ds)}
.hint button{color:var(--ds);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.login .grass{position:absolute;left:0;right:0;bottom:-1px;height:70px;width:100%;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media(max-width:860px){.login{grid-template-columns:1fr}.login .l{padding-bottom:10px}.login .l img{margin-bottom:26px}}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 31px)}
.side{background:var(--ds);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:calc(100vh - 31px)}
.side .logo img{height:46px;width:auto;margin:0 8px 24px}
.side a.nl{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mist);font-weight:500;transition:background .25s,color .25s,transform .3s var(--ease)}
.side a.nl:hover{background:rgba(255,255,255,.06);color:#fff}
.side a.nl.on{background:rgba(134,197,63,.16);color:#fff}
.side a.nl svg{width:20px;height:20px;flex:none}
.side .cnt{margin-left:auto;background:var(--vf);color:var(--ds);font-size:.75rem;font-weight:900;border-radius:99px;padding:1px 8px;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.side .cnt.on{transform:scale(1)}
.side .who{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:16px 8px 0;font-size:.85rem;color:var(--mist)}
.side .who b{display:block;color:#fff;font-size:.95rem}
.side .who button{margin-top:10px;color:var(--fb);font-weight:700}
.main{padding:clamp(18px,3vw,40px);min-width:0}
.topbar{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0 0;height:auto;top:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;gap:0}
  .side .logo,.side .who{display:none}
  .side a.nl{flex-direction:column;gap:3px;font-size:.68rem;padding:6px 8px;position:relative}
  .side .cnt{position:absolute;top:0;right:4px;margin:0}
  .main{padding-bottom:100px}
  .topbar{display:flex;justify-content:space-between;align-items:center;background:var(--ds);color:#fff;padding:12px 16px}
  .topbar img{height:36px}
  .topbar button{color:var(--fb);font-weight:700;font-size:.9rem}
}
.view{animation:fade .5s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ph1{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.ph1 h1{font-size:clamp(2rem,3.6vw,2.8rem);margin-top:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.g3,.g2{grid-template-columns:1fr}}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr}}
.stagger>*{animation:fade .6s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.18s}.stagger>*:nth-child(5){animation-delay:.24s}.stagger>*:nth-child(6){animation-delay:.3s}.stagger>*:nth-child(7){animation-delay:.36s}.stagger>*:nth-child(8){animation-delay:.42s}

/* dashboard */
.hello{background:var(--ds);color:#fff;border-radius:22px;padding:30px;position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.hello h2{font-size:clamp(1.8rem,3vw,2.4rem)}
.hello p{color:var(--mist)}
.hello .grass{position:absolute;left:0;right:0;bottom:-1px;height:46px;width:100%;pointer-events:none}
.tier{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:6px 14px 6px 6px;margin-top:12px;font-weight:700}
.tier i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8rem;color:var(--ds)}
.big{font-family:var(--head);font-size:2.4rem;line-height:1;color:var(--ds)}
.stat span{font-size:.85rem;color:var(--mute)}
.qa{display:flex;gap:14px;align-items:center;padding:16px;border-radius:14px;border:1px solid var(--line);background:#fff;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.qa:hover{transform:translateY(-3px);box-shadow:0 18px 30px -20px rgba(34,55,43,.5)}
.qa .ic{width:46px;height:46px;border-radius:12px;background:var(--tint);display:grid;place-items:center;flex:none}
.qa b{display:block}
.qa span{font-size:.85rem;color:var(--mute)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:.94rem}
.tbl th{text-align:left;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer;transition:background .2s}.tbl tr.click:hover{background:var(--tint)}
.tw{overflow-x:auto}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.s-Requested{background:#F7EEDF;color:var(--brown)}.s-Confirmed{background:var(--tint);color:var(--ds);box-shadow:inset 0 0 0 1px var(--mist)}.s-Scheduled{background:var(--fb);color:var(--ds)}.s-Delivered{background:var(--ds);color:#fff}.s-Paid{background:var(--vf);color:var(--ds)}

/* shop */
.tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:22px;position:relative}
.tabs button{padding:.6em 1.2em;border-radius:10px;font-weight:700;color:var(--mute);position:relative;z-index:1;transition:color .3s}
.tabs button.on{color:#fff}
.tabs .pill{position:absolute;top:4px;bottom:4px;border-radius:10px;background:var(--ds);transition:left .45s var(--ease),width .45s var(--ease)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.prod{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.prod:hover{transform:translateY(-4px);box-shadow:0 22px 40px -26px rgba(34,55,43,.55)}
.sw{height:110px;background:var(--ds) url('assets/grass-verdant.png') bottom center/auto 70% repeat-x;position:relative;transition:background-position 1.2s var(--ease)}
.prod:hover .sw{background-position:40px 100%}
.sw .tag{position:absolute;top:10px;left:10px;background:#fff;color:var(--ds);font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px}
.mi{height:110px;background:var(--tint);display:grid;place-items:center}
.mi svg{width:54px;height:54px}
.prod .b{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.prod h3{font-size:1.35rem}
.prod .d{font-size:.88rem;color:var(--mute)}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-size:1.25rem}
.price s{color:var(--mute);font-size:.9rem}
.price em{font-style:normal;font-size:.75rem;font-weight:700;color:var(--ds);background:var(--fb);padding:2px 8px;border-radius:99px}
.qty{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.qty .inp{padding:.6em .8em}
.qty label{font-size:.72rem;font-weight:700;color:var(--mute);display:block;margin-bottom:3px}
.prod .sub{font-size:.82rem;color:var(--mute)}
.prod .add{margin-top:6px}
.added{animation:bump .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes bump{40%{transform:scale(1.06)}}

/* cart */
.line{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line b{display:block}
.line span{font-size:.85rem;color:var(--mute)}
.line .x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);color:var(--mute);transition:color .2s,border-color .2s}
.line .x:hover{color:var(--red);border-color:#f0c9c4}
.sum{display:grid;gap:10px}
.sum div{display:flex;justify-content:space-between}
.sum .disc{color:#4f8a22;font-weight:700}
.sum .tot{border-top:1px solid var(--line);padding-top:12px;font-size:1.25rem;font-weight:900}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .25s,background .25s}
.opt input{margin-top:4px;accent-color:var(--ds)}
.opt label:has(input:checked){border-color:var(--vf);background:var(--tint)}
.opt b{display:block}.opt span{font-size:.84rem;color:var(--mute)}
@media(max-width:600px){.opt{grid-template-columns:1fr}}
.empty{text-align:center;padding:50px 20px;color:var(--mute)}
.empty svg{width:70px;height:70px;margin-bottom:12px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,33,27,.6);display:grid;place-items:center;padding:20px;opacity:0;transition:opacity .35s var(--ease)}
.modal.on{opacity:1}
.modal .box{background:#fff;border-radius:22px;padding:30px;width:min(520px,100%);max-height:90vh;overflow:auto;transform:translateY(20px) scale(.97);transition:transform .45s var(--ease)}
.modal.on .box{transform:none}
.modal h2{font-size:2rem;margin-bottom:8px}
.check{width:74px;height:74px;border-radius:50%;background:var(--vf);display:grid;place-items:center;margin-bottom:16px;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.check svg{width:38px;height:38px}
.check path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .35s ease-out forwards}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
.toast{position:fixed;left:50%;bottom:30px;z-index:90;background:var(--ds);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 18px 30px -16px rgba(0,0,0,.6);transform:translate(-50%,30px);opacity:0;transition:transform .45s var(--ease),opacity .3s}
.toast.on{transform:translate(-50%,0);opacity:1}
@media(max-width:900px){.toast{bottom:90px}}
.pct{width:80px;padding:.45em .6em}
.note{font-size:.8rem;color:var(--mute)}

/* ---------- phone layout ---------- */
.demo-bar .short{display:none}
.grid>*{min-width:0}
.cartbar{display:none}
@media(max-width:700px){
  body{font-size:15.5px}
  .demo-bar .long{display:none}.demo-bar .short{display:inline}
  .main{padding:16px 14px 110px}
  .ph1{margin-bottom:18px}.ph1 .btn{width:100%}
  .ph1 h1{font-size:2rem}
  .card{padding:16px;border-radius:14px}
  .hello{padding:22px 20px 56px;border-radius:18px}.hello .btn{width:100%}
  .big{font-size:1.75rem}
  .g4{gap:10px}
  .grid[style*="1fr 1fr"]{grid-template-columns:1fr!important}
  .opt{grid-template-columns:1fr}
  .tabs{display:flex;width:100%}.tabs button{flex:1}
  .prods{grid-template-columns:1fr}
  /* tables become stacked cards */
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:14px 2px;border-bottom:1px solid var(--line)}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{display:block;padding:0;border:0;text-align:left!important;font-size:.92rem}
  .tbl td::before{content:attr(data-l);display:block;font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
  .tbl td.tj{grid-column:1/-1;order:-1;font-weight:700;font-size:1rem}
  .tbl td.tj::before{display:none}
  .tbl td.tt{font-weight:900}
  .tbl td.ts{grid-column:1/-1}.tbl td.ts .btn{width:100%}
  .tbl .pct{width:90px}
  .tw{overflow:visible}
  /* cart */
  .line{grid-template-columns:1fr auto;gap:4px 12px}
  .line .x{grid-row:1/3;grid-column:2;align-self:start}
  .line>div[style*="text-align:right"]{text-align:left!important;grid-column:1}
  .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:35;justify-content:space-between;align-items:center;gap:10px;background:var(--vf);color:var(--ds);padding:14px 16px;border-radius:14px;box-shadow:0 14px 30px -12px rgba(20,33,27,.55);transform:translateY(140%);opacity:0;transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
  .cartbar.on{transform:none;opacity:1;pointer-events:auto}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom));max-width:calc(100% - 32px);text-align:center}
  .modal{align-items:end;padding:0}
  .modal .box{border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;transform:translateY(100%)}
  .modal.on .box{transform:none}
  .lcard{padding:24px}
  .login .l{padding:28px 22px 6px}
  .login .l p{font-size:1rem}
}

/* opening animation (same as the Turf Calculator) */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;cursor:pointer;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 38px,rgba(0,0,0,.04) 38px 76px),radial-gradient(120% 90% at 50% 0%,#22372B 0%,var(--ds) 45%,var(--ds2) 100%);transition:transform .7s cubic-bezier(.65,0,.25,1)}
.intro.out{transform:translateY(-100%)}
.intro:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--vf),var(--fb),var(--vf))}
.intro svg{width:min(460px,92vw);height:auto;overflow:visible}
.intro .i-sun{transform-origin:480px 216px;transform:scale(0);opacity:0;animation:sunUp .55s cubic-bezier(.2,.9,.3,1.25) .1s forwards}
.intro .i-g{stroke-dasharray:1 1;stroke-dashoffset:1}
.intro .i-g1{animation:grow 1s cubic-bezier(.3,0,.15,1) .45s forwards}
.intro .i-g2{animation:grow 1.2s cubic-bezier(.3,0,.15,1) .6s forwards}
.intro .i-g3{animation:grow .95s cubic-bezier(.3,0,.15,1) .8s forwards}
.intro .i-logo{opacity:0;animation:fadeIn .6s ease-out 1.75s forwards}
.intro .skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12.5px;color:rgba(255,255,255,.45)}
@keyframes sunUp{to{transform:scale(1);opacity:1}}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.intro{display:none}}
</style>
</head>
<body>
<div class="intro" id="intro" aria-hidden="true">
  <svg viewBox="0 0 900 345">
    <defs>
      <clipPath id="inClip"><rect x="0" y="0" width="900" height="274.5"/></clipPath>
      <mask id="inMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="345">
        <g fill="none" stroke="#fff" stroke-linecap="round">
          <path class="i-g i-g1" pathLength="1" stroke-width="26" d="M437.6,276 L437.6,270.7 C436.7,187.7 449.8,116.1 500,61.1 L512,48"/>
          <path class="i-g i-g2" pathLength="1" stroke-width="30" d="M463.4,276 L463.4,270.7 C470.6,159.5 532.8,61.5 631.9,1.2 L648,-9"/>
          <path class="i-g i-g3" pathLength="1" stroke-width="26" d="M495.5,276 L495.5,270.7 C498.8,206.6 525.2,155.7 572,119.1 L584,109"/>
        </g>
      </mask>
    </defs>
    <circle class="i-sun" cx="480" cy="216" r="98" fill="#E2E872" clip-path="url(#inClip)"/>
    <g mask="url(#inMask)"><image href="assets/logo-white-fresh-blade.png" x="-3.5" y="-3" width="900" height="345" clip-path="url(#inClip)"/></g>
    <image class="i-logo" href="assets/logo-white-fresh-blade.png" x="-3.5" y="-3" width="900" height="345"/>
  </svg>
  <div class="skip">Tap to skip</div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="wind" x="-3%" y="-30%" width="106%" height="160%" color-interpolation-filters="sRGB">
