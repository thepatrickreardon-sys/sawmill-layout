<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8590c">
<title>Evolution Inclusive Climber · Step by step</title>
<style>
:root{--bg:#eef2f4;--panel:#fff;--ink:#15212b;--muted:#5b6b78;--line:#d3dce2;--paint:#e8590c;--paintsoft:#fff0e6;--steel:#1f5f8b;--steelsoft:#e6f0f7;--warn:#a86500;--warnbg:#fbefd9;--bad:#b42318;--badbg:#fbe4e1;--good:#1e7d45;--goodbg:#e3f3e9;
--display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0d141a;--panel:#16212a;--ink:#e6edf2;--muted:#93a4b1;--line:#293844;--paint:#ff7a2e;--paintsoft:#3a2414;--steel:#6fb3e6;--steelsoft:#14283a;--warn:#f0a63a;--warnbg:#3a2a10;--bad:#ff7466;--badbg:#3d1915;--good:#4cc47e;--goodbg:#163626;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--body)}
header{position:sticky;top:0;z-index:5;background:var(--paint);color:#fff;padding:10px 14px calc(10px) 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header a{color:#fff;text-decoration:none;font-weight:700;font-size:15px;border:1.5px solid rgba(255,255,255,.7);border-radius:8px;padding:5px 10px;white-space:nowrap}
header h1{font:700 22px/1.1 var(--display);margin:0;flex:1;letter-spacing:.3px}
header .prog{font:700 15px var(--display);background:rgba(0,0,0,.2);border-radius:20px;padding:4px 10px;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:12px 12px 80px}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px;color:var(--muted)}
.intro b{color:var(--ink)}
h2{font:700 20px var(--display);text-transform:uppercase;letter-spacing:.6px;color:var(--steel);margin:22px 4px 8px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.step.done{opacity:.55}
.step.done .num{background:var(--good)}
.top{display:flex;gap:12px;padding:12px 14px 6px;align-items:flex-start}
.num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--paint);color:#fff;font:700 22px/40px var(--display);text-align:center;border:0;cursor:pointer}
.what{font-weight:700;font-size:18px;padding-top:7px}
.body{padding:0 14px 12px 66px}
.hw{list-style:none;margin:6px 0 0;padding:0;font-size:15px}
.hw li{padding:5px 0;border-top:1px dashed var(--line)}
.hw li:first-child{border-top:0}
.hw .q{display:inline-block;min-width:0;font-weight:700;color:var(--steel)}
.pn{color:var(--muted);font-size:13px}
.note{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:15px;font-weight:700}
.note.bad{background:var(--badbg);color:var(--bad)}
.tip{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--steelsoft);color:var(--steel);font-size:15px}
figure{margin:0;background:#fff;border-top:1px solid var(--line);padding:8px;text-align:center}
figure img{max-width:100%;height:auto;max-height:340px;cursor:zoom-in}
figcaption{font:700 14px var(--display);color:#5b6b78;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.figs{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:620px){.figs.two{grid-template-columns:1fr 1fr}}
#zoom{position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;display:none}
#zoom.on{display:block}
#zoom img{width:200%;max-width:none;display:block}
#zoom button{position:fixed;top:10px;right:10px;font:700 17px var(--body);background:var(--paint);color:#fff;border:0;border-radius:10px;padding:10px 16px}
.reset{display:block;margin:20px auto;font:15px var(--body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 14px}
</style></head><body>
<header><a href="../#docs">‹ App</a><h1>Evolution Inclusive Climber · step by step</h1><span class="prog" id="prog"></span></header>
<main>
<div class="intro"><b>Burke 370-0209 Evolution Inclusive Climber</b>, packet pages 72–76. It ramps from the <b>72" deck up to the 120" deck</b> (posts 180C3, 192C2, 196C1, 200S1). Hardware is per place. <b>Tap the orange number</b> to check a step off. <b>Tap a drawing</b> to blow it up.</div>
<div id="list"></div>
<button class="reset" id="reset">Clear all check marks</button>
</main>
<div id="zoom"><button id="zclose">Close</button><img alt=""></div>
<script>
const D='evolution-climber/';
const S=[
{
"sec": "Before you start"
},
{
"n": 1,
"t": "Look over the layout",
"figs": [
[
"top",
"Top view – 96\" long, 48\" wide"
],
[
"iso",
"Iso view – detail locations"
],
[
"end",
"End view – HDPE side vs metal side"
]
],
"notes": [
[
"HDPE enclosure always goes on one side, metal enclosure on the other. Check the end view before step 8."
]
],
"tip": "Don't tighten until told to. Clean PVC coating out of the holes if needed."
},
{
"sec": "Climber weldment"
},
{
"n": 2,
"t": "Under-platform panel under the LOWER (72\") deck",
"d": [
"AA"
],
"hw": [
[
"2×",
"3/8\" × 1\" SS button head cap screw",
"001-0119"
],
[
"4×",
"3/8\" SS flat washer",
"021-0033"
],
[
"2×",
"3/8\" SS nut",
"002-0036"
]
],
"notes": [
[
"Panel goes UNDER the platform, not on the outside, or the climber won't go together later.",
"bad"
]
],
"tip": "Only the two OUTSIDE holes of the panel 018-0398 for now."
},
{
"n": 3,
"t": "Lift the climber in, bolt the lower end through deck and panel",
"d": [
"AB"
],
"hw": [
[
"2×",
"3/8\" × 1¾\" SS button head cap screw",
"001-0120"
],
[
"2×",
"3/8\" SS flat washer (top)",
"021-0033"
],
[
"2×",
"3/8\" SS flat washer (under)",
"021-0033"
],
[
"2×",
"3/8\" SS nut",
"002-0036"
]
],
"tip": "Detail AB views 1–3 show the order: climber on top of the deck, panel under."
},
{
"n": 4,
"t": "Bolt the top end to the 120\" deck",
"d": [
"B"
],
"hw": [
[
"2×",
"3/8\" × 1\" SS button head cap screw",
"001-0117"
],
[
"2×",
"3/8\" SS flat washer (top)",
"021-0033"
],
[
"2×",
"3/8\" SS flat washer (under)",
"021-0033"
],
[
"2×",
"3/8\" SS nut",
"002-0036"
]
]
},
{
"sec": "Belt"
},
{
"n": 5,
"t": "Unroll the belt, trim plates on both ends",
"d": [
"C"
],
"hw": [
[
"3×",
"3/8\" × ½\" SS socket head barrel nut (top)",
"002-0053"
],
[
"3×",
"3/8\" × ¾\" SS button head cap screw (under)",
"001-0116"
],
[
"3×",
"3/8\" SS flat washer",
"021-0033"
],
[
"1×",
"8 ga trim plate",
"007-1887"
]
],
"notes": [
[
"The end stamped \"0873\" goes at the LOWER end."
]
],
"tip": "2 places (top and bottom end of the belt)."
},
{
"n": 6,
"t": "Bolt the belt sides to the climber",
"d": [
"D"
],
"hw": [
[
"1×",
"3/8\" × ½\" SS button head cap screw",
"001-0143"
],
[
"1×",
"3/8\" SS flat washer",
"021-0033"
],
[
"1×",
"3/8\" × ½\" SS socket head barrel nut",
"002-0053"
]
],
"tip": "34 places total."
},
{
"n": 7,
"t": "Tighten the climber and belt hardware"
},
{
"sec": "Barriers & enclosures"
},
{
"n": 8,
"t": "Build the two barrier assemblies",
"d": [
"E"
],
"figs": [
[
"side",
"Barrier & panels side view"
]
],
"hw": [
[
"1×",
"3/8\" × 2\" SS button head cap screw",
"001-0121"
]
],
"tip": "Both HDPE infill enclosures (030-0367) go on one barrier (030-0368), both all-metal enclosures (030-0370) on the other. 4 places."
},
{
"n": 9,
"t": "Straight bracket castings on the posts",
"d": [

],
"hw": [

],

],

]
],

},
{
"n": 10,
"t": "Lift the assemblies in, sleeve into the castings, bolt plates to the decks",
"d": [
"G"
],
"hw": [
[
"1×",

"001-0117"
],
[
"2×",
"3/8\" SS flat washer",
"021-0033"
],
[
"1×",
"3/8\" SS nut",
"002-0036"
]
],
"tip": "4 places."
},
{
"n": 11,
"t": "Drill and rivet the castings",
"d": [
"F"
],
"hw": [
[
"1×",

"019-0020"
]
],
"notes": [
[
"Push the enclosures ALL the way into the castings before you rivet."
]
],
"tip": "Drill ¼\" through casting and enclosure using the casting's pilot hole. Drive the rivet until the center pin is flush."
},
{
"sec": "Panels"
},
{
"n": 12,
"t": "Panels on the HDPE enclosures and the barriers",
"d": [
"H"
],
"hw": [
[
"1×",
"3/8\" × ¾\" SS button head cap screw",
"001-0116"
],
[
"1×",
"5/16\" SS flat washer",
"021-0032"
],
[
"1×",
"3/8\" × ½\" SS socket head barrel nut",
"002-0053"
]
],
"tip": "32 places. Enclosure panel 018-0023 on the HDPE enclosures. Top 018-0026, center 018-0030 and lower 018-0031 panels on the barriers."
},
{
"n": 13,
"t": "Tighten all hardware"
}
];
const KEY='gug-evolution-climber-steps-done';
let done={}; try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  let h='';
  for(const s of S){
    if(s.sec){h+=`<h2>${esc(s.sec)}</h2>`;continue;}
    const id=String(s.n);
    const figs=(s.d||[]).map(k=>[D+'d'+k+'.jpg','Detail '+k]).concat((s.figs||[]).map(([f,c])=>[D+f+'.jpg',c]));
    h+=`<section class="step${done[id]?' done':''}" data-id="${esc(id)}"><div class="top"><button class="num" aria-label="Check off step ${esc(id)}">${done[id]?'✓':esc(id)}</button><div class="what">${esc(s.t)}${s.d?` <span class="pn">· Detail ${s.d.join(' & ')}</span>`:''}</div></div>`;
    if(s.hw||s.notes||s.tip){h+='<div class="body">';
      if(s.hw) h+='<ul class="hw">'+s.hw.map(([q,w,p])=>`<li>${q?`<span class="q">${esc(q)}</span> `:''}${esc(w)}${p?` <span class="pn">${esc(p)}</span>`:''}</li>`).join('')+'</ul>';
      for(const [t,c] of (s.notes||[])) h+=`<div class="note ${c||''}">⚠ ${esc(t)}</div>`;
      if(s.tip) h+=`<div class="tip">${esc(s.tip)}</div>`;
      h+='</div>';}
    if(figs.length) h+=`<div class="figs${figs.length>1?' two':''}">`+figs.map(([src,c])=>`<figure><figcaption>${esc(c)}</figcaption><img src="${src}" alt="${esc(c)}" loading="lazy"></figure>`).join('')+'</div>';
    h+='</section>';
  }
  document.getElementById('list').innerHTML=h;
  const steps=S.filter(s=>!s.sec), n=steps.filter(s=>done[String(s.n)]).length;
  document.getElementById('prog').textContent=n+' / '+steps.length;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.num'); if(b){const id=b.closest('.step').dataset.id; done[id]=!done[id]; if(!done[id]) delete done[id]; try{localStorage.setItem(KEY,JSON.stringify(done))}catch(_){} render(); return;}
  const im=e.target.closest('figure img'); if(im){const z=document.getElementById('zoom'); z.querySelector('img').src=im.src; z.classList.add('on'); z.scrollTo(0,0); return;}
});
document.getElementById('zclose').onclick=()=>document.getElementById('zoom').classList.remove('on');
document.getElementById('reset').onclick=()=>{ if(confirm('Clear all check marks?')){done={}; try{localStorage.removeItem(KEY)}catch(_){} render();} };
render();
</script>
</body></html>
